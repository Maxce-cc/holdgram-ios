name: Build HoldGram iOS

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Bazel & Tools
        run: |
          brew install bazelisk zsign || true

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcode-select -p
          xcodebuild -version

      - name: Fetch Submodules from .gitmodules
        run: |
          python3 -c '
          import os, subprocess, shutil

          SUBMODULE_COMMITS = {
              "build-system/bazel-rules/apple_support": ("https://github.com/bazelbuild/apple_support.git", "872de7149cfbcaaf854c7867e98b6d4798ba0d27"),
              "build-system/bazel-rules/rules_apple": ("https://github.com/ali-fareed/rules_apple.git", "485016eb5b0948cc17307064e7977a6d68e94046"),
              "build-system/bazel-rules/rules_swift": ("https://github.com/bazelbuild/rules_swift.git", "dd10a2497a691237eb9716586acee1a9c4fe3e59"),
              "build-system/bazel-rules/rules_xcodeproj": ("https://github.com/MobileNativeFoundation/rules_xcodeproj.git", "f6a54168d19f917d0630e7d4efa8f2f9fa0ddc36"),
              "submodules/TgVoipWebrtc/tgcalls": ("https://github.com/TelegramMessenger/tgcalls.git", "a024eaabf13c189d9577a14fb244bd242825ac96"),
              "submodules/rlottie/rlottie": ("https://github.com/TelegramMessenger/rlottie.git", "53c9679069eb6b6513ccc3c892ef4f4a760658da"),
              "submodules/tlottie/tlottie": ("https://github.com/dkaraush/tlottie.git", "31f1b542f88e7b4be9a01e749920d857535fc715"),
              "third-party/dav1d/dav1d": ("https://github.com/ali-fareed/dav1d.git", "330e20672e85f9de1678dccd6957845898ef57a1"),
              "third-party/libvpx/libvpx": ("https://github.com/webmproject/libvpx.git", "e7bfd8b6c230a6824e7fd1efa2378a7322986128"),
              "third-party/mtproto-engine": ("https://github.com/TelegramMessenger/mtproto-engine.git", "0d738b0d159cda8e7dd8e193a563c832fd0e06ed"),
              "third-party/td/td": ("https://github.com/tdlib/td", "e894536b2f46caad93f997448d2daff9431b19dd"),
              "third-party/wallet-engine/wallet-engine": ("https://github.com/i582/wallet-engine.git", "e59e0d89d7ee90c388bf36e3334c5b276f396697"),
              "third-party/webrtc/webrtc": ("https://github.com/ali-fareed/webrtc.git", "6513c71d6c80311d69a0a6b9c09fcf32cfbeb247"),
          }

          for path, (url, sha) in SUBMODULE_COMMITS.items():
              if not os.path.exists(path) or not os.listdir(path):
                  print(f"==> Fetching {path} at {sha}...")
                  os.makedirs(path, exist_ok=True)
                  try:
                      subprocess.run(["git", "init"], cwd=path, check=True)
                      subprocess.run(["git", "remote", "add", "origin", url], cwd=path, check=True)
                      subprocess.run(["git", "fetch", "--depth", "1", "origin", sha], cwd=path, check=True)
                      subprocess.run(["git", "checkout", "FETCH_HEAD"], cwd=path, check=True)
                  except Exception as e:
                      print(f"Warning fetching {path}: {e}")
          '

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv /Users/Shared/$(basename "$GITHUB_WORKSPACE") /Users/Shared/telegram-ios
          find /Users/Shared/telegram-ios -type f \( -name "*.sh" -o -name "*.py" -o -name "*.pl" -o -name "configure" \) -exec chmod +x {} +

      - name: Build HoldGram
        run: |
          set -xeuo pipefail

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset || echo 0)"
          APP_VERSION="$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')"
          COMMIT_COUNT="$(git rev-list --count HEAD || echo 1)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          # Fix executable permissions for all build scripts
          chmod -R +x build-system tools submodules third-party || true
          find . -type f \( -name "*.sh" -o -name "*.py" -o -name "*.pl" -o -name "configure" \) -exec chmod +x {} +

          # Ensure plisttool bypasses profile expiration, bundle id, and entitlements checks
          python3 -c '
          import os
          for p in ["build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py"]:
              if os.path.exists(p):
                  with open(p, "r", encoding="utf-8") as f:
                      c = f.read()
                  c = c.replace("if expire and expire < datetime.datetime.now():", "if False and expire and expire < datetime.datetime.now():")
                  c = c.replace("if not self._does_id_match(bundle_id, provisioned_id,", "if False and not self._does_id_match(bundle_id, provisioned_id,")
                  c = c.replace("def _validate_entitlements_against_profile(self, entitlements):", "def _validate_entitlements_against_profile(self, entitlements):\n    return")
                  c = c.replace("raise PlistToolError(msg)", "print(\"WARNING: \" + str(msg))\n      return")
                  c = c.replace("if not child_id.startswith(prefix):", "if False and not child_id.startswith(prefix):")
                  with open(p, "w", encoding="utf-8") as f:
                      f.write(c)
                  print(f"==> Patched {p} in canonical dir")
          '

          # Pin bazel to selected Xcode
          build-system/GGXcodeConfig.sh 2>/dev/null || build-system/XTGXcodeConfig.sh 2>/dev/null || true

          # Import fake certificates into temporary keychain
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs || true

          # Build release IPA
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # Collect IPA
          OUTPUT_PATH="build/artifacts"
          mkdir -p "$OUTPUT_PATH"
          if [ -f "bazel-bin/Telegram/Telegram.ipa" ]; then
            cp "bazel-bin/Telegram/Telegram.ipa" "$OUTPUT_PATH/HoldGram.ipa"
          else
            find bazel-out/ -name "Telegram.ipa" -exec cp {} "$OUTPUT_PATH/HoldGram.ipa" \;
          fi

          # Optional custom signing if secrets are provided
          if [ -n "${CERT_P12_BASE64:-}" ] && [ -n "${PROVISION_BASE64:-}" ]; then
            echo "==> Custom certificate detected in secrets, signing with zsign..."
            echo "$CERT_P12_BASE64" | base64 -d > /tmp/cert.p12
            echo "$PROVISION_BASE64" | base64 -d > /tmp/profile.mobileprovision
            zsign -k /tmp/cert.p12 -p "${CERT_PASSWORD:-}" -m /tmp/profile.mobileprovision -o "$OUTPUT_PATH/HoldGram-signed.ipa" "$OUTPUT_PATH/HoldGram.ipa"
            mv "$OUTPUT_PATH/HoldGram-signed.ipa" "$OUTPUT_PATH/HoldGram.ipa"
            echo "==> Signed successfully with custom certificate!"
          else
            echo "==> No custom certificate secrets provided. Standard IPA produced."
          fi

          echo "==> Creating HoldGram-Sideload.ipa (stripped PlugIns and Watch for clean ESign signing)..."
          rm -rf /tmp/sideload_extract
          mkdir -p /tmp/sideload_extract
          unzip -q "$OUTPUT_PATH/HoldGram.ipa" -d /tmp/sideload_extract
          rm -rf /tmp/sideload_extract/Payload/*.app/PlugIns /tmp/sideload_extract/Payload/*.app/Watch
          (cd /tmp/sideload_extract && zip -qr "$SOURCE_DIR/$OUTPUT_PATH/HoldGram-Sideload.ipa" Payload)
          rm -rf /tmp/sideload_extract

          ls -la "$OUTPUT_PATH"
        env:
          CERT_P12_BASE64: ${{ secrets.P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoldGram-${{ env.APP_VERSION }}-Build-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/*.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}
          name: HoldGram v${{ env.APP_VERSION }} (Build ${{ env.BUILD_NUMBER }})
          body: |
            ### HoldGram iOS
            * **Version**: ${{ env.APP_VERSION }}
            * **Build**: ${{ env.BUILD_NUMBER }}
            * **Base**: Telegram iOS 13.1.1 + Ghostgram Features + Developer Tools
            * Собрано автоматически через GitHub Actions.
            * Готово к установке через TrollStore, AltStore, Sideloadly или Scarlet.
          files: |
            /Users/Shared/telegram-ios/build/artifacts/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
